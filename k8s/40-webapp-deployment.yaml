apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: starter-ware
  labels:
    app: webapp
    app.kubernetes.io/part-of: starter-ware
spec:
  # Stateless Next.js server — safe to scale and to roll out with RollingUpdate.
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
        app.kubernetes.io/part-of: starter-ware
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: webapp
          image: starter-ware-webapp:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
          # No dedicated health route exists, so probe "/" (returns 200 HTML).
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            # Standalone server writes nothing to the rootfs at runtime.
            readOnlyRootFilesystem: true
