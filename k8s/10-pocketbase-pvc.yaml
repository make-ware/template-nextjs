apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocketbase-data
  namespace: starter-ware
  labels:
    app: pocketbase
    app.kubernetes.io/part-of: starter-ware
spec:
  # Single-writer SQLite DB — one pod, one volume. RWO is correct (do not use RWX).
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # No storageClassName → uses the cluster default (kind/minikube provide one).
